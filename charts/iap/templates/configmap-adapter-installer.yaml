{{- if and .Values.initAdapterInstaller.enabled .Values.mountAdapterVolume -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "iap.fullname" . }}-adapter-installer
  labels:
    {{- include "iap.labels" . | nindent 4 }}
    app.kubernetes.io/component: "adapter-installer"
  annotations:
    kubernetes.io/description: "ConfigMap containing the adapter installer script for IAP initContainer."
    {{- include "iap.annotations" . | nindent 4 }}
data:
  {{- if .Values.initAdapterInstaller.gitCredentials.existingSecret }}
  git-askpass.sh: |
    #!/bin/sh
    # Used through GIT_ASKPASS: answers git's username and password prompts from the mounted Secret.
    case "$1" in
      Username*) cat /git-credentials/{{ .Values.initAdapterInstaller.gitCredentials.usernameKey }} ;;
      *) cat /git-credentials/{{ .Values.initAdapterInstaller.gitCredentials.passwordKey }} ;;
    esac
  {{- end }}
  install-adapters.sh: |
    #!/bin/bash
    set -e
    
    echo "Running adapter installation on $HOSTNAME..."
    cd /opt/itential/platform/services/custom
    
    # Working area for "folders" repositories: ownership markers (<folder>.tree), the last installed commit of each
    # repository and temporary build directories. It lives on the volume so the swap into place is a same-filesystem rename.
    # It is only created when a "folders" repository is configured.
    STATE_DIR=".adapter-installer"

    # Node.js major version of this init container. Compiled dependencies are tied to it, so each adapter records the
    # major it was installed with in NODE_MARKER and is reinstalled when the major changes (for example Node.js 20 to 22).
    NODE_VERSION=$(node -v)
    NODE_MAJOR=${NODE_VERSION#v}
    NODE_MAJOR=${NODE_MAJOR%%.*}
    NODE_MARKER=".installer-node-major"
    echo "Init container Node.js version: $NODE_VERSION"

    # True when adapter directory $1 was installed with the Node.js major of this init container.
    # A missing marker (adapter installed by an older chart version) counts as a mismatch.
    built_with_current_node() {
        [ "$(cat "$1/$NODE_MARKER" 2>/dev/null)" = "$NODE_MAJOR" ]
    }

    # Prints the commit a branch, tag or HEAD points to on the remote. Annotated tags resolve to their commit.
    # Returns 1 when the remote cannot be read or the ref does not exist.
    remote_commit_for() {
        local url="$1" ref="$2" out commit
        if [ -z "$ref" ]; then
            out=$(git ls-remote "$url" HEAD) || return 1
            commit=$(printf '%s\n' "$out" | head -n 1 | cut -f1)
        else
            out=$(git ls-remote "$url" "refs/heads/$ref" "refs/tags/$ref") || return 1
            commit=$(printf '%s\n' "$out" | awk -F'\t' -v r="refs/tags/$ref^{}" '$2 == r { print $1 }')
            [ -n "$commit" ] || commit=$(printf '%s\n' "$out" | head -n 1 | cut -f1)
        fi
        [ -n "$commit" ] || return 1
        printf '%s\n' "$commit"
    }

    has_modules() {
        [ -d "$1/node_modules" ] && [ -n "$(ls -A "$1/node_modules" 2>/dev/null)" ]
    }

    # True when folder $1 matches one of the glob patterns in $2 (space separated): its node_modules come from git
    # and npm install is not run for it. Globbing is only applied to the patterns, never to the file system.
    skips_npm() {
        local name="$1" pat
        local -a pats=()
        read -r -a pats <<< "$2"
        for pat in "${pats[@]}"; do
            # shellcheck disable=SC2254
            case "$name" in
                $pat) return 0 ;;
            esac
        done
        return 1
    }
    
    # A folder is complete when it exists and, unless npm install is skipped for it, has its node_modules
    # built with the current Node.js major. Folders that skip npm install ship their node_modules in git and are not checked.
    folder_complete() {
        if skips_npm "$1" "$2"; then
            [ -d "$1" ]
        else
            has_modules "$1" && built_with_current_node "$1"
        fi
    }

    # Names of the folders installed from the repository identified by key ($1)
    owned_adapters() {
        local f
        for f in "$STATE_DIR"/*.tree; do
            [ -f "$f" ] || continue
            if [ "$(cut -d' ' -f2 "$f")" = "$1" ]; then
                basename "$f" .tree
            fi
        done
    }

    # One git repository that holds many adapter/app folders. Each folder is installed as its own directory in custom/.
    # Usage: install_folders_repo <url> <branch> <path inside the repository> <skipNpmInstall patterns>
    # Records its own results in SUCCESSFUL_INSTALLS, FAILED_INSTALLS and REMOVED_ADAPTERS.
    install_folders_repo() {
        local url="$1" ref="$2" sub="${3#/}" skip="$4" prefix="" key label commit_file work remote commit
        local entry name tree marker owner tmp old e complete owned
        local failed=0 found=0 seen=" " clone_args=() ls_args=()
        sub="${sub%/}"
        [ -z "$sub" ] || prefix="$sub/"
        key=$(printf '%s|%s' "$url" "$sub" | cksum | cut -d' ' -f1)
        label="$(basename "$url" .git)${sub:+/$sub}"
        commit_file="$STATE_DIR/repo-$key.commit"
        mkdir -p "$STATE_DIR"
        # Leftovers from a run that was killed halfway
        rm -rf "$STATE_DIR"/tmp-* "$STATE_DIR"/old-* "$STATE_DIR"/work-*

        # Quick check: one ls-remote call decides whether anything changed
        if ! remote=$(remote_commit_for "$url" "$ref"); then
            if [ -f "$commit_file" ]; then
                echo "WARNING: cannot read ${ref:-the default branch} of $url, keeping the installed folders"
                SUCCESSFUL_INSTALLS+=("$label (git unreachable, kept installed folders)")
            else
                echo "ERROR: cannot read ${ref:-the default branch} of $url and nothing is installed yet"
                FAILED_INSTALLS+=("$label (cannot read repository)")
            fi
            return 0
        fi

        if [ -f "$commit_file" ] && [ "$(cat "$commit_file")" = "$remote" ]; then
            complete=true
            for owned in $(owned_adapters "$key"); do
                folder_complete "$owned" "$skip" || complete=false
            done
            if [ "$complete" = "true" ]; then
                echo "Repository $label already installed (commit: ${remote:0:8}), skipping"
                SUCCESSFUL_INSTALLS+=("$label (already installed)")
                return 0
            fi
            echo "Some folders of $label are missing, incomplete or were not installed with Node.js $NODE_MAJOR, reconciling"
        fi

        # Something changed: fetch the commit once, without a checkout
        work="$STATE_DIR/work-$key"
        rm -rf "$work"
        if [ -n "$ref" ]; then clone_args=(--branch "$ref"); fi
        echo "Fetching $label (${ref:-default branch})..."
        if ! git clone --quiet --depth 1 --no-checkout "${clone_args[@]}" "$url" "$work"; then
            echo "ERROR: clone of $url failed, keeping the installed folders"
            FAILED_INSTALLS+=("$label (clone failed)")
            rm -rf "$work"
            return 0
        fi
        commit=$(git -C "$work" rev-parse HEAD)
        if [ -n "$prefix" ]; then ls_args=("$prefix"); fi

        while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            name=$(basename "$entry")
            if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
                echo "Ignoring folder with an unsupported name: $name"
                continue
            fi
            if ! git -C "$work" cat-file -e "HEAD:$prefix$name/package.json" 2>/dev/null; then
                echo "Ignoring $name (no package.json)"
                continue
            fi
            found=$((found + 1))
            seen="$seen$name "

            for e in "${EXPECTED_ADAPTERS[@]}"; do
                if [ "$e" = "$name" ]; then
                    echo "ERROR: folder $name is also configured as its own repository"
                    FAILED_INSTALLS+=("$name (name used by another repositories entry)")
                    failed=$((failed + 1))
                    continue 2
                fi
            done

            tree=$(git -C "$work" rev-parse "HEAD:$prefix$name")
            marker="$STATE_DIR/$name.tree"
            if [ -f "$marker" ]; then
                owner=$(cut -d' ' -f2 "$marker")
                if [ "$owner" != "$key" ]; then
                    echo "ERROR: $name was installed from a different repository entry, remove it manually to take it over"
                    FAILED_INSTALLS+=("$name (installed from another repository entry)")
                    failed=$((failed + 1))
                    continue
                fi
                if [ "$(cut -d' ' -f1 "$marker")" = "$tree" ] && folder_complete "$name" "$skip"; then
                    echo "Keeping $name (unchanged)"
                    SUCCESSFUL_INSTALLS+=("$name (already installed)")
                    continue
                fi
            fi

            # Build in a temporary directory, then swap into place, so a failed build never damages the installed copy
            echo "Installing $name from $label..."
            tmp="$STATE_DIR/tmp-$name"
            old="$STATE_DIR/old-$name"
            rm -rf "$tmp" "$old"
            mkdir -p "$tmp"
            if ! ( set -o pipefail; git -C "$work" archive "HEAD:$prefix$name" | tar -x -C "$tmp" ); then
                echo "Failed to extract $name"
                rm -rf "$tmp"
                FAILED_INSTALLS+=("$name (extract failed)")
                failed=$((failed + 1))
                continue
            fi

            if skips_npm "$name" "$skip"; then
                echo "$name matches skipNpmInstall, using the committed node_modules and skipping npm install"
            else
                echo "Running npm install for $name..."
                export NPM_CONFIG_CACHE=/tmp/.npm
                mkdir -p /tmp/.npm
                (cd "$tmp" && npm install {{- range (.Values.initAdapterInstaller.npmInstallOptions | default (list "--silent" "--no-audit" "--no-fund" "--ignore-scripts")) }} {{ . }}{{- end }} 2>/dev/null) || true
                if ! has_modules "$tmp"; then
                    echo "NPM install failed for $name, keeping the previous copy if there is one"
                    rm -rf "$tmp"
                    FAILED_INSTALLS+=("$name (npm install failed)")
                    failed=$((failed + 1))
                    continue
                fi
                printf '%s\n' "$NODE_MAJOR" > "$tmp/$NODE_MARKER"
            fi
    
            if [ -d "$name" ]; then mv "$name" "$old"; fi
            if mv "$tmp" "$name"; then
                printf '%s %s\n' "$tree" "$key" > "$marker"
                rm -rf "$old"
                SUCCESSFUL_INSTALLS+=("$name")
            else
                echo "Failed to move $name into place"
                if [ -d "$old" ]; then mv "$old" "$name"; fi
                rm -rf "$tmp"
                FAILED_INSTALLS+=("$name (install failed)")
                failed=$((failed + 1))
            fi
        done < <(git -c core.quotepath=off -C "$work" ls-tree -d --name-only HEAD "${ls_args[@]}")

        if [ "$found" -gt 0 ]; then
            # Git is the source of truth: folders installed from this repository that are gone from it are removed
            for owned in $(owned_adapters "$key"); do
                case "$seen" in
                    *" $owned "*) ;;
                    *)
                        echo "Removing $owned (no longer in the repository)"
                        rm -rf "$owned" "$STATE_DIR/$owned.tree"
                        REMOVED_ADAPTERS+=("$owned")
                        ;;
                esac
            done
        else
            echo "ERROR: no folders with a package.json found in $label, removing nothing"
            FAILED_INSTALLS+=("$label (no adapter folders found)")
            failed=$((failed + 1))
        fi

        rm -rf "$work"
        # Only a fully successful run records the commit, otherwise the next start retries
        if [ "$failed" -eq 0 ]; then
            printf '%s\n' "$commit" > "$commit_file"
        else
            rm -f "$commit_file"
        fi
        return 0
    }
    
    # Build list of expected adapters from repositories
    EXPECTED_ADAPTERS=()
    for i in "${!REPOS[@]}"; do
        # "folders" entries hold many adapters, they are not a single adapter name
        if [ "${TYPES[$i]:-}" = "folders" ]; then
            continue
        fi
        REPO_URL="${REPOS[$i]}"
        ADAPTER_NAME=$(basename "$REPO_URL" .git)
        EXPECTED_ADAPTERS+=("$ADAPTER_NAME")
    done
    
    # Remove any existing adapter directories not in the repositories list
    echo "Cleaning up obsolete adapters..."
    REMOVED_ADAPTERS=()
    for EXISTING_DIR in adapter-*; do
        if [ -d "$EXISTING_DIR" ]; then
            ADAPTER_FOUND=false
            # Folders installed from a "folders" repository are managed by install_folders_repo
            if [ -f "$STATE_DIR/$EXISTING_DIR.tree" ]; then
                ADAPTER_FOUND=true
            fi
            for EXPECTED_ADAPTER in "${EXPECTED_ADAPTERS[@]}"; do
                if [ "$EXISTING_DIR" = "$EXPECTED_ADAPTER" ]; then
                    ADAPTER_FOUND=true
                    break
                fi
            done
            
            if [ "$ADAPTER_FOUND" = "false" ]; then
                echo "Removing obsolete adapter: $EXISTING_DIR"
                rm -rf "$EXISTING_DIR"
                REMOVED_ADAPTERS+=("$EXISTING_DIR")
            else
                echo "Keeping existing adapter: $EXISTING_DIR"
            fi
        fi
    done
    
    if [ ${#REMOVED_ADAPTERS[@]} -gt 0 ]; then
        echo "Removed ${#REMOVED_ADAPTERS[@]} obsolete adapters: ${REMOVED_ADAPTERS[*]}"
    else
        echo "No obsolete adapters found to remove"
    fi
    echo ""
    
    # Initialize arrays for tracking results
    SUCCESSFUL_INSTALLS=()
    FAILED_INSTALLS=()
    
    TOTAL_COUNT=${#REPOS[@]}
    
    for i in "${!REPOS[@]}"; do
        REPO_URL="${REPOS[$i]}"
        BRANCH="${BRANCHES[$i]}"

        if [ "${TYPES[$i]:-}" = "folders" ]; then
            echo "========================================="
            echo "Processing folders repository: $REPO_URL (branch: ${BRANCH:-default}, path: ${PATHS[$i]:-/})"
            echo "========================================="
            install_folders_repo "$REPO_URL" "$BRANCH" "${PATHS[$i]:-}" "${SKIP_NPM[$i]:-}"
            echo ""
            continue
        fi

        ADAPTER_NAME=$(basename "$REPO_URL" .git)

        echo "========================================="
        echo "Processing adapter: $ADAPTER_NAME"
        echo "Repository URL: $REPO_URL"
        if [ -n "$BRANCH" ]; then
            echo "Branch/Tag: $BRANCH"
        else
            echo "Branch/Tag: default"
        fi
        echo "========================================="
        
        # Check if adapter already exists and is on the correct branch
        NEEDS_INSTALL=true
        SKIP_REASON="already up to date"
        if [ -d "$ADAPTER_NAME" ]; then
            cd "$ADAPTER_NAME"
            
            # Check if it's a git repository
            if [ -d ".git" ]; then
                # If the remote cannot be queried (expired token, network, git host down), keep a complete installed
                # copy instead of treating the adapter as changed and deleting it
                REMOTE_OK=true
                git ls-remote origin HEAD >/dev/null 2>&1 || REMOTE_OK=false
                if [ "$REMOTE_OK" = "false" ]; then
                    if [ -d "node_modules" ] && [ "$(ls -A node_modules 2>/dev/null | wc -l)" -gt 0 ]; then
                        echo "WARNING: cannot reach the git remote for $ADAPTER_NAME, keeping the installed copy (commit: $(git rev-parse --short=8 HEAD 2>/dev/null))"
                        NEEDS_INSTALL=false
                        SKIP_REASON="git remote unreachable, kept installed copy"
                    else
                        echo "Cannot reach the git remote and dependencies are missing, will try to reinstall"
                    fi
                elif [ -n "$BRANCH" ]; then
                    # Get the current commit hash
                    CURRENT_COMMIT=$(git rev-parse HEAD 2>/dev/null)
                    
                    # Check if the requested branch/tag exists remotely
                    REQUESTED_COMMIT=$(git ls-remote origin "refs/tags/$BRANCH" 2>/dev/null | cut -f1)
                    
                    if [ -z "$REQUESTED_COMMIT" ]; then
                        # Not a tag, check if it's a branch
                        REQUESTED_COMMIT=$(git ls-remote origin "refs/heads/$BRANCH" 2>/dev/null | cut -f1)
                    fi
                    
                    if [ -n "$REQUESTED_COMMIT" ] && [ "$CURRENT_COMMIT" = "$REQUESTED_COMMIT" ]; then
                        echo "Adapter $ADAPTER_NAME already on correct branch/tag: $BRANCH (commit: ${CURRENT_COMMIT:0:8})"
                        NEEDS_INSTALL=false
                    else
                        CURRENT_SHORT=${CURRENT_COMMIT:0:8}
                        REQUESTED_SHORT=${REQUESTED_COMMIT:0:8}
                        echo "Adapter $ADAPTER_NAME needs update - current: ${CURRENT_SHORT:-'unknown'}, requested: ${REQUESTED_SHORT:-'unknown'}"
                    fi
                else
                    # No specific branch requested, check if we're on default branch
                    CURRENT_COMMIT=$(git rev-parse HEAD 2>/dev/null)
                    DEFAULT_BRANCH=$(git ls-remote --symref origin HEAD | sed -n 's#^ref: refs/heads/\([^[:space:]]*\).*#\1#p')
                    DEFAULT_COMMIT=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" 2>/dev/null | cut -f1)
                    
                    if [ -n "$DEFAULT_COMMIT" ] && [ "$CURRENT_COMMIT" = "$DEFAULT_COMMIT" ]; then
                        echo "Adapter $ADAPTER_NAME already on default branch: $DEFAULT_BRANCH (commit: ${CURRENT_COMMIT:0:8})"
                        NEEDS_INSTALL=false
                    else
                        CURRENT_SHORT=${CURRENT_COMMIT:0:8}
                        DEFAULT_SHORT=${DEFAULT_COMMIT:0:8}
                        echo "Adapter $ADAPTER_NAME needs update - current: ${CURRENT_SHORT:-'unknown'}, default: ${DEFAULT_SHORT:-'unknown'}"
                    fi
                fi
                
                # Check if node_modules exists and has content
                if [ "$NEEDS_INSTALL" = "false" ]; then
                    if [ ! -d "node_modules" ] || [ "$(ls -A node_modules 2>/dev/null | wc -l)" -eq 0 ]; then
                        echo "Dependencies missing, will reinstall"
                        NEEDS_INSTALL=true
                    fi
                fi

                # Dependencies built with another Node.js major (or by an older chart version) must be rebuilt
                if [ "$NEEDS_INSTALL" = "false" ] && ! built_with_current_node "."; then
                    if [ "$REMOTE_OK" = "false" ]; then
                        echo "WARNING: $ADAPTER_NAME was not installed with Node.js $NODE_MAJOR and the git remote is unreachable, keeping the installed copy"
                    else
                        echo "$ADAPTER_NAME was installed with Node.js $(cat "$NODE_MARKER" 2>/dev/null || echo unknown), this init container runs Node.js $NODE_MAJOR, will reinstall"
                        NEEDS_INSTALL=true
                    fi
                fi
            else
                echo "Directory exists but not a git repository, will reinstall"
            fi
            
            cd /opt/itential/platform/services/custom
        fi
        
        if [ "$NEEDS_INSTALL" = "false" ]; then
            echo "Skipping $ADAPTER_NAME installation ($SKIP_REASON)"
            SUCCESSFUL_INSTALLS+=("$ADAPTER_NAME (already installed)")
        else
            # Remove existing directory if it exists
            if [ -d "$ADAPTER_NAME" ]; then
                echo "Removing existing $ADAPTER_NAME directory..."
                rm -rf "$ADAPTER_NAME"
            fi
        
            # Clone the adapter repository with branch if specified
            echo "Cloning $ADAPTER_NAME repository..."
            if [ -n "$BRANCH" ]; then
                echo "Using branch/tag: $BRANCH"
                CLONE_CMD="git clone --branch $BRANCH $REPO_URL"
            else
                CLONE_CMD="git clone $REPO_URL"
            fi
            
            if eval "$CLONE_CMD"; then
                echo "Repository $ADAPTER_NAME cloned successfully"
                
                if [ -d "$ADAPTER_NAME" ]; then
                    cd "$ADAPTER_NAME"
                    echo "Running npm install for $ADAPTER_NAME..."
                    
                    # Set npm cache to a writable directory and run npm install
                    export NPM_CONFIG_CACHE=/tmp/.npm
                    mkdir -p /tmp/.npm
                    
                    # Run npm install and capture exit code (ignore stderr for warnings)
                    npm install {{- range (.Values.initAdapterInstaller.npmInstallOptions | default (list "--silent" "--no-audit" "--no-fund" "--ignore-scripts")) }} {{ . }}{{- end }} 2>/dev/null
                    NPM_EXIT_CODE=$?
                    
                    # Check if packages were actually installed regardless of exit code
                    if [ -d "node_modules" ] && [ "$(ls -A node_modules 2>/dev/null | wc -l)" -gt 0 ]; then
                        echo "NPM install completed successfully for $ADAPTER_NAME"
                        printf '%s\n' "$NODE_MAJOR" > "$NODE_MARKER"
                        SUCCESSFUL_INSTALLS+=("$ADAPTER_NAME")
                    else
                        echo "NPM install failed for $ADAPTER_NAME"
                        FAILED_INSTALLS+=("$ADAPTER_NAME (npm install failed)")
                    fi
                    
                    cd /opt/itential/platform/services/custom
                else
                    echo "Directory $ADAPTER_NAME not found after clone"
                    FAILED_INSTALLS+=("$ADAPTER_NAME (directory not found)")
                fi
            else
                echo "Failed to clone repository for $ADAPTER_NAME"
                FAILED_INSTALLS+=("$ADAPTER_NAME (clone failed)")
            fi
        fi
        
        echo ""
    done
    
    # Set permissions for the entire custom directory
    echo "Setting final permissions for /opt/itential/platform/services/custom..."
    chmod -R 775 /opt/itential/platform/services/custom 2>/dev/null || echo "chmod: some permission operations not permitted"
    chown -R itential:users /opt/itential/platform/services/custom 2>/dev/null || echo "chown: some ownership operations not permitted"
    echo "Final permissions set to 775 recursively"
    echo ""
    
    # Generate final report
    SUCCESSFUL_COUNT=${#SUCCESSFUL_INSTALLS[@]}
    FAILED_COUNT=${#FAILED_INSTALLS[@]}
    REMOVED_COUNT=${#REMOVED_ADAPTERS[@]}
    
    echo "========================================="
    echo "ADAPTER INSTALLATION REPORT"
    echo "========================================="
    echo "Total adapters processed: $TOTAL_COUNT"
    echo "Successful installations: $SUCCESSFUL_COUNT"
    echo "Failed installations: $FAILED_COUNT"
    echo "Obsolete adapters removed: $REMOVED_COUNT"
    echo ""
    
    if [ $SUCCESSFUL_COUNT -gt 0 ]; then
        echo "Successfully installed adapters:"
        for ADAPTER in "${SUCCESSFUL_INSTALLS[@]}"; do
            echo "  - $ADAPTER"
        done
        echo ""
    fi
    
    if [ $FAILED_COUNT -gt 0 ]; then
        echo "Failed installations:"
        for ADAPTER in "${FAILED_INSTALLS[@]}"; do
            echo "  - $ADAPTER"
        done
        echo ""
    fi
    
    if [ $REMOVED_COUNT -gt 0 ]; then
        echo "Removed obsolete adapters:"
        for ADAPTER in "${REMOVED_ADAPTERS[@]}"; do
            echo "  - $ADAPTER"
        done
        echo ""
    fi
    
    echo "Final directory contents:"
    ls -la /opt/itential/platform/services/custom
    echo "========================================="
    echo "Adapter installation process completed"
    echo "========================================"
{{- end }}