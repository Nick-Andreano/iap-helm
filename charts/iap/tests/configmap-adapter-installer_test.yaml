suite: test configmap-adapter-installer template
templates:
  - configmap-adapter-installer.yaml
values:
  - ../tests/test-values.yaml
tests:
  - it: should not create ConfigMap when initAdapterInstaller is disabled
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create ConfigMap when mountAdapterVolume is false
    set:
      mountAdapterVolume: false
      initAdapterInstaller:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create ConfigMap when both conditions are false
    set:
      mountAdapterVolume: false
      initAdapterInstaller:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create ConfigMap when both conditions are true
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1

  - it: should have correct metadata when enabled
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-iap-adapter-installer
      - exists:
          path: metadata.labels
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: iap
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: "adapter-installer"

  - it: should have correct annotations when enabled
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - exists:
          path: metadata.annotations
      - equal:
          path: metadata.annotations["kubernetes.io/description"]
          value: "ConfigMap containing the adapter installer script for IAP initContainer."

  - it: should contain install-adapters.sh script
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - exists:
          path: data
      - exists:
          path: data["install-adapters.sh"]

  - it: should have shebang and set -e in script
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: "^#!/bin/bash"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*set -e.*"

  - it: should contain hostname logging
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*Running adapter installation on.*HOSTNAME.*"

  - it: should contain npm install with default options when npmInstallOptions not specified
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*npm install --silent --no-audit --no-fund --ignore-scripts 2>/dev/null.*"

  - it: should use custom npm install options when specified
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
        npmInstallOptions:
          - "--production"
          - "--ignore-scripts"
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*npm install --production --ignore-scripts 2>/dev/null.*"

  - it: should handle empty npmInstallOptions list
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
        npmInstallOptions: []
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*npm install --silent --no-audit --no-fund --ignore-scripts 2>/dev/null.*"

  - it: should contain git clone logic
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*git clone.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*CLONE_CMD=.*"

  - it: should contain cleanup logic for obsolete adapters
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*Cleaning up obsolete adapters.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*REMOVED_ADAPTERS=.*"

  - it: should contain permission setting logic
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*chmod -R 775.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*chown -R itential:users.*"

  - it: should contain npm cache configuration
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*export NPM_CONFIG_CACHE=/tmp/.npm.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*mkdir -p /tmp/.npm.*"

  - it: should contain installation report generation
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*ADAPTER INSTALLATION REPORT.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*SUCCESSFUL_INSTALLS=.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*FAILED_INSTALLS=.*"

  - it: should handle version detection with git commits
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*git rev-parse HEAD.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*git ls-remote.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*CURRENT_COMMIT.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*REQUESTED_COMMIT.*"

  - it: should contain node_modules validation logic
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: '.*if \[ -d "node_modules" \] && \[ "\$\(ls -A node_modules.*'
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*Dependencies missing, will reinstall.*"

  - it: should work with complex npmInstallOptions
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
        npmInstallOptions:
          - "--silent"
          - "--no-audit"
          - "--no-fund" 
          - "--production"
          - "--ignore-scripts"
          - "--legacy-peer-deps"
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*npm install --silent --no-audit --no-fund --production --ignore-scripts --legacy-peer-deps 2>/dev/null.*"

  - it: should contain working directory setup
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*cd /opt/itential/platform/services/custom.*"

  - it: should contain final directory listing
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*ls -la /opt/itential/platform/services/custom.*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*Final directory contents:.*"

  - it: should not contain git-askpass.sh by default
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - notExists:
          path: data["git-askpass.sh"]

  - it: should contain git-askpass.sh reading the default Secret keys when gitCredentials.existingSecret is set
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
        gitCredentials:
          existingSecret: adapter-git-credentials
    asserts:
      - matchRegex:
          path: data["git-askpass.sh"]
          pattern: "^#!/bin/sh"
      - matchRegex:
          path: data["git-askpass.sh"]
          pattern: 'Username\*\) cat /git-credentials/username ;;'
      - matchRegex:
          path: data["git-askpass.sh"]
          pattern: '\*\) cat /git-credentials/password ;;'

  - it: should use custom Secret key names in git-askpass.sh
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
        gitCredentials:
          existingSecret: adapter-git-credentials
          usernameKey: user
          passwordKey: token
    asserts:
      - matchRegex:
          path: data["git-askpass.sh"]
          pattern: 'cat /git-credentials/user ;;'
      - matchRegex:
          path: data["git-askpass.sh"]
          pattern: 'cat /git-credentials/token ;;'

  - it: should contain the folders (monorepo) installer
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: ".*install_folders_repo\\(\\).*"
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: '.*if \[ "\$\{TYPES\[\$i\]:-\}" = "folders" \].*'

  - it: should skip npm install only for folders matching skipNpmInstall
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: '.*if skips_npm "\$name" "\$skip"; then\s+echo "\$name matches skipNpmInstall.*'

  - it: should use the configured npm options for folders
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
        npmInstallOptions:
          - "--production"
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: '.*\(cd "\$tmp" && npm install --production 2>/dev/null\).*'

  - it: should keep folders when git cannot be read and remove only folders owned by the repository
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: '.*cannot read \$\{ref:-the default branch\} of \$url, keeping the installed folders.*'
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: '.*Removing \$owned \(no longer in the repository\).*'
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: '.*if \[ "\$found" -gt 0 \].*'

  - it: should not clean up folders managed by a folders repository as obsolete adapters
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: '.*if \[ -f "\$STATE_DIR/\$EXISTING_DIR.tree" \].*'

  - it: should check that the git remote is reachable before deciding an adapter changed
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'REMOTE_OK=true\s+git ls-remote origin HEAD >/dev/null 2>&1 \|\| REMOTE_OK=false'

  - it: should keep an installed adapter with its dependencies when the git remote is unreachable
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'if \[ "\$REMOTE_OK" = "false" \]; then\s+if \[ -d "node_modules" \] && \[ "\$\(ls -A node_modules 2>/dev/null \| wc -l\)" -gt 0 \]; then'
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'WARNING: cannot reach the git remote for \$ADAPTER_NAME, keeping the installed copy'
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'NEEDS_INSTALL=false\s+SKIP_REASON="git remote unreachable, kept installed copy"'

  - it: should reinstall when the git remote is unreachable and the dependencies are missing
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'Cannot reach the git remote and dependencies are missing, will try to reinstall'

  - it: should report why an adapter installation was skipped
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'SKIP_REASON="already up to date"'
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'Skipping \$ADAPTER_NAME installation \(\$SKIP_REASON\)'

  - it: should detect the Node.js major version of the init container
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'NODE_VERSION=\$\(node -v\)'
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'NODE_MARKER="\.installer-node-major"'

  - it: should reinstall an adapter that was installed with another Node.js major
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'built_with_current_node "\."'
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'this init container runs Node\.js \$NODE_MAJOR, will reinstall'

  - it: should keep a mismatched adapter when the git remote is unreachable
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'was not installed with Node\.js \$NODE_MAJOR and the git remote is unreachable, keeping the installed copy'

  - it: should record the Node.js major after a successful npm install
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'printf ''%s\\n'' "\$NODE_MAJOR" > "\$NODE_MARKER"'
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'printf ''%s\\n'' "\$NODE_MAJOR" > "\$tmp/\$NODE_MARKER"'

  - it: should check the Node.js major of folders that run npm install
    set:
      mountAdapterVolume: true
      initAdapterInstaller:
        enabled: true
    asserts:
      - matchRegex:
          path: data["install-adapters.sh"]
          pattern: 'has_modules "\$1" && built_with_current_node "\$1"'
