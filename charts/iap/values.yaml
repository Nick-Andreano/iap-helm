---
# Default values for iap.

# -- The number of pods to start
replicaCount: 2
# -- The port that the application will run on.
applicationPort: 3443
# -- The port that the Gateway Manager will listen on.
websocketPort: 8080
# -- Toggle to enable TLS features and configuration.
useTLS: true
# -- Toggle the use of websockets (IAG5 integration)
useWebSockets: true
# -- Toggle a volume mount which contains adapter code. When this is set to false it is assumed that
# all adapters will be layered into the Itential provided container.
mountAdapterVolume: false
# -- Toggle a volume with will contain log files. Not required if log data is being captured from
# Stdout.
mountLogVolume: false

# Init container for installing adapters
initAdapterInstaller:
  # -- Enable the init container that installs adapters to the persistent volume.
  # -- Note: This only works when mountAdapterVolume is true, as the initContainer 
  # -- needs a persistent volume to install adapters into.
  enabled: false
  image:
    # -- The repository for the adapter installer init container image
    repository: node
    # -- The tag for the adapter installer init container image. Use the same Node.js major version as the
    # Itential Platform image (Node.js 22 for Platform 6.6.0 and later). Adapters are reinstalled when this major changes.
    tag: "22-bullseye"
    # -- The image pull policy for the adapter installer init container
    pullPolicy: IfNotPresent
  # -- Security context for the init container
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
  # -- List of npm install options to use when installing adapter dependencies
  npmInstallOptions:
    - "--silent"
    - "--no-audit"
    - "--no-fund"
    - "--ignore-scripts"
  # -- Extra environment variables for the adapter installer init container, as a map of name to value.
  # Use it for settings that git and npm need, for example an HTTP proxy:
  #   env:
  #     HTTP_PROXY: "http://proxy.example.com:3128"
  #     http_proxy: "http://proxy.example.com:3128"
  #     HTTPS_PROXY: "http://proxy.example.com:3128"
  #     https_proxy: "http://proxy.example.com:3128"
  #     NO_PROXY: ".svc,.cluster.local,10.0.0.0/8"
  #     no_proxy: ".svc,.cluster.local,10.0.0.0/8"
  # Set both the upper and lower case names: git (libcurl) ignores an upper case HTTP_PROXY and only reads
  # http_proxy for plain http:// URLs. These variables are set on the init container only. Use the top level
  # `env` for the Itential Platform container. Do not set GIT_ASKPASS or GIT_TERMINAL_PROMPT here, the chart
  # sets them when gitCredentials is used.
  env: {}
  # -- Credentials for cloning adapter repositories over HTTPS from a private git server.
  # Create the Secret in the release namespace, for example:
  #   kubectl create secret generic adapter-git-credentials --from-literal=username=<user> --from-literal=password=<token>
  # The Secret is mounted read-only into the init container and handed to git through GIT_ASKPASS (works with the git 2.30 in the default node:22-bullseye image).
  # The credentials are not written to the adapter volume or to the clone's .git/config.
  gitCredentials:
    # -- Name of an existing Secret holding the git credentials. Empty means anonymous clones.
    existingSecret: ""
    # -- Key in the Secret that holds the username
    usernameKey: username
    # -- Key in the Secret that holds the password or access token
    passwordKey: password
  # -- List of adapter repositories to install
  # Each repository can be:
  # 1. A simple string URL (clones default branch)
  # 2. An object with 'url' and optional 'branch' fields
  # 3. An object with 'type: folders': one repository that holds many adapter folders (a monorepo).
  #    Optional 'path' is the directory inside the repository that contains the folders (default: the repository root).
  #    Every folder with a package.json is installed as /opt/itential/platform/services/custom/<folder>.
  #    Every folder gets npm install, except folders matching a pattern in the optional 'skipNpmInstall' list
  #    (shell globs, for example "app-*"). Those are installed as committed, with the node_modules that are in git.
  #    A folder that is removed from git is removed from the volume.
  repositories:
    # Examples (supports GitLab, GitHub, Bitbucket, and other Git providers):
    # - "https://gitlab.com/itentialopensource/adapters/adapter-example.git"  # Uses default branch
    # - url: "https://github.com/company/adapter-custom.git"
    #   branch: "v1.2.3"  # Clones specific branch/tag
    # - url: "https://git.example.com/team/iap-adapters.git"
    #   type: folders
    #   branch: develop
    #   path: ""  # optional
    #   skipNpmInstall: ["app-*"]  # optional
  

# Post-installation test configuration 
postInstallTests:
  # -- Enable or disable all post-install tests (helm test command)
  enabled: true
  # -- Maximum time to wait for tests to pass before failing (in seconds)
  readinessTimeout: 300
  # -- Time to live after test completion (in seconds)
  # Job, pod resources including logs will be automatically deleted after this duration
  ttlSecondsAfterFinished: 300  # 5 minutes default
  # Process count verification configuration
  processCountTest:
    # -- Optional Itential applications that won't cause test failure if missing
    optionalProcesses:
      - "Pronghorn_LifecycleManager_Application"
      - "Pronghorn_ConfigurationManager_Application"
      - "Pronghorn_NSOManager_Application"
      - "Pronghorn_AppArtifacts_Application"

certManager:
  # -- Toggles installation of cert-manager as a chart dependency. Defaults to false because most
  # enterprise clusters run a shared, cluster-wide cert-manager managed by the platform team.
  # Set to true only in dev or test environments where no cluster-wide cert-manager is available.
  # If enabled, always install with --atomic (e.g. helm install --atomic --timeout 10m) to surface
  # the cert-manager webhook race condition as a hard failure rather than a silent partial deploy.
  enabled: false

external-dns:
  # -- Optional dependency to generate a static external DNS name
  enabled: false

# The Itential image to use, its version, and its location
# The image name will depend on the entitlement that has been granted.
image:
  # -- The image repository
  # -- Contact Itential to get the correct image repository for your entitlement.
  repository:
  # -- The image pull policy
  pullPolicy: IfNotPresent
  # -- The image tag
  tag:

# -- The secrets object used to pull the image from the repo
imagePullSecrets: []

serviceAccount:
  # -- When true, the chart creates the ServiceAccount. When false, the pod uses whatever name is set
  # -- (or the namespace default SA if name is empty). Set to false for environments that manage SAs externally.
  create: false
  # -- The name of the service account to assign to the StatefulSet pods.
  # -- When set, the pod will use this service account for RBAC and IAM role bindings (e.g. IRSA on AWS EKS,
  # -- Workload Identity on GKE, Workload Identity on AKS). When create is true and name is empty, the chart
  # -- uses the release fullname. When create is false and name is empty, Kubernetes uses the namespace default SA.
  name: ""
  # -- Annotations to add to the ServiceAccount. Used for cloud IAM federation:
  # -- AWS EKS IRSA:  eks.amazonaws.com/role-arn: "arn:aws:iam::<account>:role/<role>"
  # -- GCP GKE:       iam.gke.io/gcp-service-account: "<sa>@<project>.iam.gserviceaccount.com"
  # -- Azure AKS:     azure.workload.identity/client-id: "<client-id>"
  annotations: {}
  # -- Controls whether the pod automounts the SA token. Set to true when using IRSA or Workload Identity.
  automountServiceAccountToken: false

# The issuer to be used if using cert-manager to generate the TLS certificates
issuer:
  # -- Toggle to use the issuer object or not
  enabled: true
  # -- The type of issuer
  kind: ClusterIssuer
  # -- The name of this issuer.
  name: iap-ca-issuer
  # -- The CA secret to be used by this issuer when creating TLS certificates.
  caSecretName: someSecretName

# The certificate object to use by cert-manager to generate the TLS certificates.
certificate:
  # -- Toggle to use the certificate object or not
  enabled: true
  # -- The name of the secret where the TLS certificate will be stored
  secretName: ""
  issuerRef:
    # -- The name of the issuer with the CA reference.
    name: iap-ca-issuer
    # -- The issuer type
    kind: Issuer
    # -- The API group of the issuer. Leave empty for built-in cert-manager issuers; set for external issuers (e.g. awspca.cert-manager.io).
    group: ""
  # -- Specifies how long before the certificate expires that cert-manager should try to renew.
  renewBefore: 48h
  # -- Specifies how long the certificate should be valid for (its lifetime).
  duration: 2160h
  # -- The Common Name to use when creating certificates
  commonName: iap.example.com
  # -- The domain used to auto-generate per-replica DNS names in the certificate (e.g. example.com
  # -- produces iap-prod-0.example.com, iap-prod-1.example.com, ...).
  # --
  # -- This should match ingress.directAccess.baseDomain. If they differ, the certificate SANs
  # -- will not cover the ingress direct-access hostnames and TLS will fail for pod-level access.
  # -- Only set them to different values if you have a specific reason to issue a certificate that
  # -- covers a different domain than the one used for ingress routing.
  domain: example.com
  # -- DNS names to include in the certificate.
  # --
  # -- Auto (default) — leave empty and the chart generates the list from commonName and
  # -- replicaCount. For 3 replicas in namespace 'prod' this produces:
  # --   - iap.example.com                        (commonName)
  # --   - iap-prod-0.example.com                 (per-replica direct access)
  # --   - iap-prod-1.example.com
  # --   - iap-prod-2.example.com
  # --
  # -- Manual — provide the complete list and the auto-generated entries are skipped entirely.
  # -- Use this when you need SANs that differ from the auto-generated pattern (e.g. CDN aliases,
  # -- legacy hostnames, or wildcard entries).
  # --   dnsNames:
  # --     - iap.example.com
  # --     - cdn.example.com
  # --     - "*.example.com"
  dnsNames: []
  # -- Specifies any private key properties
  privateKey: {} # include all required properties, passed to the template as is
  # -- Specifies any key store properties
  keystores: {} # include all required properties, passed to the template as is
  # -- Specifies any subject fields required
  subject: {} # include all required properties, passed to the template as is

# -- Additional TLS secrets to mount as optional volumes.
# These secrets are NOT created or managed by this chart - they must exist in the namespace.
# Each entry should be a string containing the secret name.
# The secrets will be mounted at /etc/ssl/<secret-name>/
additionalTLSSecrets: []
  # Examples:
  # - "client-cert-secret"        # Mounted at /etc/ssl/client-cert-secret/
  # - "ca-bundle-secret"          # Mounted at /etc/ssl/ca-bundle-secret/
  # - "custom-tls-secret"         # Mounted at /etc/ssl/custom-tls-secret/

# Used to configure the storage class object which governs how the mounted volumes are created.
storageClass:
  # -- Toggle the use of storageClass
  enabled: true
  # -- The name of the storageClass
  name: "example-storage-class"
  # -- Specifies which volume plugin provisions the storage
  provisioner: ""
  # -- What happens to PersistentVolumes when released. Itential recommends "retain".
  reclaimPolicy: "Retain"
  # -- Controls when volume binding occurs
  volumeBindingMode: "WaitForFirstConsumer"
  # -- Key-value pairs passed to the provisioner
  parameters:

# Persistent volumes and persistent volume claims. These are used for Itential application logs and
# for Itential adapters.
persistentVolumeClaims:
  # -- Toggle the use of persistentVolumeClaims
  enabled: true
  # -- This represents the claim for the persistence for the adapters and other custom applications
  # that may have been developed by the customer.
  assetClaim:
    # -- The requested amount of storage
    storage: "20Gi"
  # -- This represents the claim for the persistence for the log files created and written to by the
  # IAP application.
  logClaim:
    # -- The requested amount of storage
    storage: "10Gi"

# The Kubernetes service object for this application
service:
  # -- The service type.
  type: "ClusterIP"
  # -- The name of this Kubernetes service object.
  name: "iap-service"
  # -- The port that this service object is listening on.
  port: 443

# The Kubernetes ingress object for this application.
ingress:
  # -- The ingress object can be disabled and will not be created with this set to false
  enabled: true
  # -- The name of this Kubernetes ingress object. Defaults to {{ fullname }}-ingress if not set.
  name: ""
  # -- The ingress controller class name tells Kubernetes which ingress controller should 
  # -- handle this ingress object. If left empty, the cluster's default IngressClass
  # -- (if configured) will be used.
  # -- Common options
  # --   alb                       - AWS Application Load Balancer (AWS Load Balancer Controller)
  # --   gce                       - Google Cloud GKE HTTP(S) Load Balancer
  # --   azure/application-gateway - Azure Application Gateway Ingress Controller (AGIC)
  # --   haproxy                   - HAProxy ingress controller
  className: ""
  # -- The ingress controller path type
  pathType: Prefix
  # Load balancer configuration
  loadBalancer:
    # -- Enable a load balancer that will distribute request to all Itential pods
    enabled: true
    # -- The Load balancer host name
    host: iap.example.com
    # -- The path
    path: /
  # Direct access configuration
  directAccess:
    # -- Enable direct access to all Itential pods.
    enabled: true
    # -- The base domain for each Itential pod, used by the templates to create host names.
    # -- This should match certificate.domain. If they differ, the certificate SANs will not
    # -- cover these ingress hostnames and TLS will fail for direct pod access.
    baseDomain: example.com
    # -- The path
    path: /
    # -- An optional host override for the direct access ingress.
    # -- By default, the direct access host names are a concatenation of
    # --   iap.fullname + Namespace + iterator + ingress.directAccess.baseDomain
    # -- If hostOverride is set, the direct access host names will be concatenated as
    # --   hostOverride + iterator + ingress.directAccess.baseDomain
    hostOverride: ""
  # -- The annotations for this ingress object. These are passed into the template as is and will
  # render as you see here. Itential leveraged AWS ALB but others should work.
  annotations:
  # -- TLS configuration for the ingress. Controls which secret the ingress controller uses for
  # -- TLS termination and which hostnames are covered by that secret.
  # --
  # -- The secretName should reference a Kubernetes TLS secret. This is typically the secret
  # -- created by the certificate object in this chart (see certificate.secretName).
  # --
  # -- Auto (default) — omit hosts and the chart generates the list from loadBalancer.host and
  # -- directAccess configuration. For 3 replicas this produces:
  # --   - iap.example.com                        (load balancer)
  # --   - iap-0.example.com                      (per-replica direct access)
  # --   - iap-1.example.com
  # --   - iap-2.example.com
  # --
  # -- Manual — provide a hosts list and the auto-generated entries are skipped entirely.
  # -- Use this when your hostnames differ from the auto-generated pattern (e.g. CDN aliases,
  # -- legacy hostnames, or when using cert-manager ingress annotations where the hosts list
  # -- drives the certificate SANs directly).
  # --
  # -- Simplified format (single secret):
  # --   tls:
  # --     secretName: iap-tls-secret
  # --     hosts:                          # optional — replaces auto-generated list
  # --       - iap.example.com
  # --       - cdn.example.com
  # --
  # -- List format (multiple secrets):
  # --   tls:
  # --     - secretName: iap-tls-secret
  # --       hosts:                        # optional — replaces auto-generated list
  # --         - iap.example.com
  tls: []

statefulset:
  enabled: true

# -- Additional pod annotations
podAnnotations: {}
# -- Additional pod labels
podLabels: {}
# -- Additional pod security context. The pods will mount some persistent volumes. These settings
# allow for that to happen.
podSecurityContext:
  fsGroup: 1001
  runAsGroup: 1001
  runAsUser: 1001
  runAsNonRoot: true
# -- Additional security context
securityContext: {}

# Container resources
resources:
  limits:
    memory: "14Gi"
  requests:
    cpu: "3"
    memory: "14Gi"

# The liveness probe used to determine if the container is alive. If the liveness probe fails,
# the kubelet kills the container, and the container is subjected to its restart policy. If a
# container does not provide a liveness probe, the default state is Success. This is an exec cmd
# directly against the container checking for the core processes that IAP needs running.
livenessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# The readiness probe used to determine if the container is ready to accept requests. If the
# readiness probe fails, the endpoints controller removes the pod’s IP address from the
# endpoints of all services that match the pod. The default state of readiness before the
# initial delay is failure. If a container does not provide a readiness probe, the default
# state is success.
readinessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  path: "/health/status?exclude-services=true"

# The startup probe used to allow some time for the application to start up. Once the startup
# probe has succeeded once, the liveness probe takes over.
startupProbe:
  enabled: true
  initialDelaySeconds: 180
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  path: "/health/status?exclude-services=true"

# -- Additional volumes to output on the Statefulset definition.
volumes: []

# -- Additional volumeMounts to output on the Statefulset definition.
volumeMounts: []

# -- Additional nodeSelectors
nodeSelector: {}

# -- Host aliases for DNS resolution within the pod
# -- Useful for resolving custom hostnames to IP addresses
# -- Common use case: Redis Sentinels that return hostnames instead of IP addresses
hostAliases: []
  # Examples:
  # - ip: "172.85.0.20"
  #   hostnames:
  #     - "pe-redis01"
  #     - "redis-master"
  # - ip: "172.85.0.21" 
  #   hostnames:
  #     - "pe-redis02"
  # - ip: "172.85.0.22"
  #   hostnames:
  #     - "pe-redis03"

# -- Additonal tolerations
tolerations: []

# -- Additional affinities
affinity: {}

# Process exporter configuration for monitoring
processExporter:
  # -- Enable process exporter sidecar container
  enabled: false
  # -- Enable ingress configuration for process exporter metrics
  ingressEnabled: false
  image:
    # -- Process exporter image repository
    repository: ncabatoff/process-exporter
    # -- Process exporter image tag
    tag: latest
  # -- Process exporter metrics port
  port: 9256

# Job Metrics Exporter configuration for monitoring IAP workflow engine metrics
jobMetricsExporter:
  # -- Enable the Job Metrics Exporter deployment
  enabled: false
  # -- Enable ingress rule exposing the /metrics endpoint via directAccess hostname
  ingressEnabled: true
  image:
    # -- Job Metrics Exporter image repository (public image, no pull secret required)
    repository: ghcr.io/itential/job-metrics-exporter
    # -- Job Metrics Exporter image tag
    tag: latest
  # -- Port the exporter listens on
  port: 9477
  # -- Name of the Kubernetes secret containing the MongoDB URI. The URI must use a
  # -- dedicated read-only MongoDB user (not the IAP user, which has read/write access).
  # -- Example: kubectl create secret generic itential-job-metrics-secrets \
  # --   --from-literal=ITENTIAL_JOB_METRIC_MONGO_URI='mongodb://ro-user:pass@host:27017/itential?replicaSet=rs0'
  mongoSecretName: "itential-job-metrics-secrets"
  # -- Key in the secret for the MongoDB URI
  mongoSecretKey: "ITENTIAL_JOB_METRIC_MONGO_URI"
  # -- MongoDB database name. Must match ITENTIAL_MONGO_DB_NAME. Defaults to "itential" if unset.
  mongoDatabase: ""
  # -- Enable change stream mode for real-time metrics (requires MongoDB replica set)
  changeStreamEnabled: true
  # -- Enable background polling mode for point-in-time status snapshots
  pollingEnabled: false
  # -- Polling interval (Go duration string, e.g. 60s, 2m)
  pollingInterval: "60s"
  # -- Log level (debug, info, warn, error)
  logLevel: "info"
  # -- Log format (json or text)
  logFormat: "json"

# Configuration properties for Itential Automation Platform.
# In most cases, the default values are sufficient. If the property is commented that means that
# the default value is being used. This is a list of all possible values for convenience. The
# values listed are the defaults where commented.
env:
  ##############
  #SERVER
  ##############
  # The name of the profile document to load from the MongoDB where legacy configuration
  # properties are stored. Not required for installations that are using environment
  # variables or a properties file.
  # ITENTIAL_PROFILE_ID: ""

  # An identifier for the server instance. This is used to uniquely identify the server in a
  # multi-server environment. If not provided, the server will generate one on startup. This will
  # be populated by the chart to the pod id and should not be used in a containerized deployment.
  # ITENTIAL_SERVER_ID: ""

  # The file path to the directory containing additional services (applications and adapters).
  # The chart will impose this value with an opinionated volume mount directory and should not be
  # used in a containerized deployment.
  # ITENTIAL_SERVICE_DIRECTORY: ""

  # Indicates whether the platform is using encrypted code files.
  # ITENTIAL_PLATFORM_ENCRYPTED: "true"

  # 64-length hex string describing a 256 bit encryption key.
  # Itential recommends that this value come from a Secret named "itential-platform-secrets".
  # ITENTIAL_ENCRYPTION_KEY: ""

  # A whitelist of services (applications/adapters) to initialize on startup of the platform.
  # If no value is given, all services will be initialized.
  # ITENTIAL_SERVICES: ""

  # The service type that will be denied CRUD operation access.
  # ITENTIAL_SERVICE_BLACKLIST : ""

  # The amount of time a service should wait before shutting down, in seconds.
  # ITENTIAL_PLATFORM_SHUTDOWN_TIMEOUT: ""

  # How often to update service health, measured in seconds.
  # ITENTIAL_SERVICE_HEALTH_CHECK_INTERVAL : "5"

  # The number of failed health checks in a row before a service is considered to be “unhealthy”.
  # ITENTIAL_SERVICE_HEALTH_CHECK_UNHEALTHY_THRESHOLD: "3"

  # If true, the platform will periodically check for dead processes.
  # ITENTIAL_DEAD_PROCESS_CHECK_ENABLED: "true"

  # How often to check if application/adapter stopped sending healthcheck pings, in seconds.
  # ITENTIAL_DEAD_PROCESS_CHECK_INTERVAL: "5"

  # Maximum time period for application/adapter without sending healthcheck ping, in seconds.
  # ITENTIAL_DEAD_PROCESS_MAX_PERIOD: "15"

  # Specifies the amount of times services will retry on crash before stopping.
  # ITENTIAL_SERVICE_CRASH_RECOVERY_MAX_RETRIES: "10"

  # Specifies the amount of times between each retry before the count will reset in milliseconds.
  # ITENTIAL_SERVICE_CRASH_RECOVERY_RESET_RETRIES_AFTER_MS: "60000"

  # The timeout for external API requests, in seconds.
  # ITENTIAL_EXTERNAL_REQUEST_TIMEOUT : "5"

  # The interval for how often IAP polls for the number of devices, in hours.
  # ITENTIAL_DEVICE_COUNT_POLLING_INTERVAL : "24"

  # If true, the platform will track detailed audit events.
  # ITENTIAL_AUDIT_ENABLED: "true"

  #############################
  # MONGO DATABASE CONNECTION #
  #############################
  # -- Instructs the MongoDB driver to use the provided user/password when connecting to MongoDB.
  ITENTIAL_MONGO_AUTH_ENABLED: "true"

  # -- The username to use when connecting to MongoDB.
  ITENTIAL_MONGO_USER: "itential"

  # The password to use when connecting to MongoDB.
  # Itential recommends that this value come from a Secret named "itential-platform-secrets".
  # ITENTIAL_MONGO_PASSWORD: ""

  # The name of the database that the MongoDB user must authenticate against.
  # ITENTIAL_MONGO_AUTH_DB: ""

  # If true, the server will not check if it is connecting to a compatible MongoDB version.
  # ITENTIAL_MONGO_BYPASS_VERSION_CHECK: "true"

  # -- The name of the MongoDB logical database to connect to.
  ITENTIAL_MONGO_DB_NAME: "itential"

  # The MongoDB connection string. For a replica set this will include all members of the
  # replica set. For Mongo Atlas this will be the SRV connection format.
  # Itential recommends that this value come from a Secret named "itential-platform-secrets".
  # ITENTIAL_MONGO_URL: ""

  # -- Instruct the MongoDB driver to use TLS protocols when connecting to the database.
  ITENTIAL_MONGO_TLS_ENABLED: "true"

  # -- If true, disables the validation checks for TLS certificates on other servers in the cluster
  # and allows the use of invalid or self-signed certificates to connect.
  ITENTIAL_MONGO_TLS_ALLOW_INVALID_CERTIFICATES: "false"

  # The .pem file that contains the root certificate chain from the Certificate Authority.
  # Specify the file name of the .pem file using absolute paths.
  # ITENTIAL_MONGO_TLS_CA_FILE: ""

  # The maximum number of connections in a connection pool.
  # Each application/adapter has its own connection pool.
  # ITENTIAL_MONGO_MAX_POOL_SIZE: ""

  ####################
  # REDIS CONNECTION #
  ####################
  # The Redis keyspace (database number) to use for the connection.
  # ITENTIAL_REDIS_DB: ""

  # -- The username to use when connecting to Redis.
  ITENTIAL_REDIS_USERNAME: "itential"

  # The password to use when connecting to Redis.
  # Itential recommends that this value come from a Secret named "itential-platform-secrets".
  # ITENTIAL_REDIS_PASSWORD: ""

  # The maximum number of times to retry a request to Redis when the connection is lost.
  # ITENTIAL_REDIS_MAX_RETRIES_PER_REQUEST : "20"

  # The maximum number of times to retry writing a heartbeat message to Redis from a service.
  # ITENTIAL_REDIS_MAX_HEARTBEAT_WRITE_RETRIES: "20"

  # -- The hostname of the Redis server. Not used when connecting to Redis Sentinels.
  ITENTIAL_REDIS_HOST: "redis.example.com"

  # -- The port to use when connecting to this Redis instance.
  ITENTIAL_REDIS_PORT: "6379"

  # The username to use when authenticating with a Redis Sentinel cluster.
  #ITENTIAL_REDIS_SENTINEL_USERNAME: "itential"

  # The password to use when authenticating with a Redis Sentinel cluster
  # Itential recommends that this value come from a Secret named "itential-platform-secrets".
  #ITENTIAL_REDIS_SENTINEL_PASSWORD: ""

  # The list of Redis Sentinel servers (hostnames and ports) to use for high availability.
  # Sample: [{"host": "172.85.0.20", "port": 26379}]
  #ITENTIAL_REDIS_SENTINELS: '[]'

  # The Redis primary name. This only has meaning when Redis is running with replication enabled.
  # The sentinels will monitor this node and consider it down only when the sentinels agree.
  # Note: The primary name should not include special characters other than: .-_ and no whitespaces.
  #ITENTIAL_REDIS_NAME: ""

  # Redis TLS configuration options for secure connections.
  # Refer to NodeJS TLS library for all supported options.
  # This must be set to "{}" if connecting to elasticache
  # ITENTIAL_REDIS_TLS: ""

